name = "Furniture Brand Reviews"
client_id = "db5beafee602d16825792984fa641886"
application_url = "https://app.furniturebrandreviews.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
dev_store_url = "furniture-brand-reviews-dev.myshopify.com"

[access_scopes]
scopes = "read_orders,read_products,read_themes"

[auth]
redirect_urls = [
  "https://app.furniturebrandreviews.com/auth/callback",
  "https://app.furniturebrandreviews.com/auth/shopify/callback",
  "https://app.furniturebrandreviews.com/api/auth/callback"
]

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["app_subscriptions/update"]
  uri = "/webhooks/app-subscriptions-update"

  [[webhooks.subscriptions]]
  topics = ["orders/fulfilled"]
  uri = "/webhooks/orders-fulfilled"

  [[webhooks.subscriptions]]
  topics = ["orders/cancelled"]
  uri = "/webhooks/orders-cancelled"

  [[webhooks.subscriptions]]
  topics = ["refunds/create"]
  uri = "/webhooks/refunds-create"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks/compliance"

[app_proxy]
url = "https://app.furniturebrandreviews.com"
subpath = "fbr"
prefix = "apps"
